project: aegis_platform
registry: registry.db
provider: local

offline_store:
  type: postgres
  host: localhost
  port: 5432
  database: aegis
  db_schema: public
  user: aegis_user
  password: ${AEGIS_DB_PASSWORD}
  sslmode: prefer

online_store:
  type: sqlite
  path: online_store.db

entity_key_serialization_version: 2
